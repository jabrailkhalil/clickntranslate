# Historical September 2026 configuration for the former xynapse.online host.
# Current public sites: translate.clickn.dev and clickn.dev; see ../README.md.
location ~ "^/clickntranslate/(styles|app)\.[a-f0-9]{12}\.(css|js)$" {
    include /etc/nginx/conf.d/security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location ~ ^/clickntranslate/(index\.html|(ru|es|de|fr|zh-CN)/(index\.html)?)?$ {
    include /etc/nginx/conf.d/security.conf;
    expires off;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri $uri/ =404;
}

location /clickntranslate/ {
    include /etc/nginx/conf.d/security.conf;
    expires off;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ =404;
}
