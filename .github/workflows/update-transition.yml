name: Published update transitions

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Published candidate version without v (prereleases allowed)
        required: true
        type: string
      platform:
        description: Platform to verify
        type: choice
        default: all
        options: [all, windows, linux]

permissions:
  contents: read

jobs:
  transition:
    if: inputs.platform != 'linux'
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {old: '1.6.0', mode: zip}
          - {old: '1.6.1', mode: zip}
          - {old: '1.7.0', mode: zip}
          - {old: '1.7.0', mode: setup}
          - {old: '1.8.0', mode: zip}
          - {old: '1.8.0', mode: setup}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install process inspection dependency
        run: python -m pip install psutil
      - name: Download verified assets and invoke the installed old updater
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate }}
          BASELINE: ${{ matrix.old }}
          PACKAGE_MODE: ${{ matrix.mode }}
          PYTHONUTF8: '1'
        run: python tools/qa_published_update.py --old-version $env:BASELINE --new-version $env:CANDIDATE --mode $env:PACKAGE_MODE
      - name: Preserve migration receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transition-${{ matrix.old }}-${{ matrix.mode }}
          path: |
            build/update-audit/**/result.json
            build/update-audit/**/application.log
            build/update-audit/**/updater.log
            build/update-audit/**/old-setup.log
            build/update-audit/**/old-ready.txt
            build/update-audit/**/restart-ready.txt
            build/update-downloads/**/releases.json
          if-no-files-found: warn

  linux-manual-transition:
    if: inputs.platform != 'windows'
    # Published 1.7 requires glibc 2.38; it cannot start on Ubuntu 22.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Replace the published AppImage and verify existing data
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate }}
        run: xvfb-run -a python tools/qa_linux_update_transition.py --new-version "$CANDIDATE"
      - name: Preserve Linux transition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-manual-transition
          path: |
            build/linux-update-audit/**/result.json
            build/linux-update-audit/**/launch-*.log
            build/linux-update-audit/**/ready-*.txt
          if-no-files-found: warn
