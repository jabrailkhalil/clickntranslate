name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            requirements: requirements.txt
          - os: ubuntu-latest
            requirements: requirements-linux.txt
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ matrix.requirements }}" pytest pyinstaller
          if [ "${{ runner.os }}" = "Linux" ]; then
            python -m pip install --no-deps "argostranslate~=1.11.0"
          fi
      - name: Run tests
        run: python -m pytest -q
