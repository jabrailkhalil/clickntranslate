name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos_signing_only:
        description: Check the permanent Mac signer only (no application test suite)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: '!inputs.macos_signing_only'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
        platform:
          - os: windows-latest
            requirements: tools/requirements/windows.txt
          - os: ubuntu-latest
            requirements: tools/requirements/linux.txt
    runs-on: ${{ matrix.platform.os }}
    name: ${{ matrix.platform.os }} (part ${{ matrix.part }}/6)
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.platform.requirements }}
      - name: Install Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi libegl1 libgl1
      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ matrix.platform.requirements }}" pytest pyinstaller
          if [ "${{ runner.os }}" = "Linux" ]; then
            python -m pip install --no-deps "argostranslate~=1.11.0"
          fi
      - name: Run tests
        run: python tools/run_ci_tests.py --parts 6 --part ${{ matrix.part }} --timeout 1500
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ runner.os }}-part-${{ matrix.part }}
          path: |
            build/ci-tests/plan.json
            build/ci-tests/part-*/results.xml
            build/ci-tests/part-*/run.json
          if-no-files-found: ignore

  macos-signing:
    if: github.event_name == 'workflow_dispatch' && inputs.macos_signing_only
    uses: ./.github/workflows/macos.yml
    with:
      signing_only: true
    secrets:
      MACOS_SIGNING_KEYCHAIN_BASE64: ${{ secrets.MACOS_SIGNING_KEYCHAIN_BASE64 }}
      MACOS_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGNING_KEYCHAIN_PASSWORD }}
