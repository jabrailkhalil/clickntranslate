name: Apply requested UI follow-up

on:
  push:
    branches: [codex/ui-polish-20260923]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply requested UI follow-up'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact reviewed patch
        shell: python
        env:
          PATCH_B64: 
        run: |
          import base64, hashlib, os, pathlib, subprocess, zlib
          patch = zlib.decompress(base64.b64decode(os.environ['PATCH_B64']))
          assert hashlib.sha256(patch).hexdigest() == 'a0b79f7998f37c294fa689f2eceb8e0d6b49b8f525bc26f5050dade09ba9c09f'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ui-followup.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '-p2', str(path)], check=True)
          subprocess.run(['git', 'apply', '-p2', str(path)], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {'main.py','assistant_preview.py','ui_details.py','tests/test_ui_polish.py','tests/test_translation_result_ui.py'}
          assert changed == expected, (changed, expected)
      - name: Commit follow-up
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py assistant_preview.py ui_details.py tests/test_ui_polish.py tests/test_translation_result_ui.py
          git commit -m 'Apply requested UI follow-up'
          git push origin HEAD:refs/heads/codex/ui-polish-20260923
