name: Publish reviewed UI source

on:
  push:
    branches: [codex/ui-polish-20260923]

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/codex/ui-polish-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify exact reviewed source patch
        shell: python
        run: |
          import base64, hashlib, os, pathlib, subprocess, zlib
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/ui-polish-20260923'
          files = sorted(pathlib.Path('.github').glob('ui-polish.payload.*'))
          assert len(files) == 4
          chunks = [p.read_text(encoding='ascii').strip() for p in files]
          for before, after in [('FKZZze', 'FKZze'), ('Atx+XtWQ5', 'Atx+XtQ5'), ('PxaXP5n4', 'PxaXP7n4')]:
              assert chunks[0].count(before) == 1
              chunks[0] = chunks[0].replace(before, after)
          patch = zlib.decompress(base64.b64decode(''.join(chunks), validate=True))
          assert len(patch) == 71691
          assert hashlib.sha256(patch).hexdigest() == '055b4a1af94ecbd0f60e50366dbc18e8fcb216387169feb0e559d0b40a509bc1'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ui-polish.patch'
          target.write_bytes(patch)
          expected_paths = {'assistant_preview.py', 'assistant_text.py', 'capture_widgets.py', 'docs/UI_POLISH_2026_09_23.md', 'main.py', 'settings_window.py', 'tests/test_fixed_window_text_layout.py', 'tests/test_guide_spotlight.py', 'tests/test_main_window_layout.py', 'tests/test_ui_polish.py', 'tools/qa_ui_polish.py', 'ui_details.py', 'ui_scaling.py'}
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(target)], text=True)
          assert {line.split('\t', 2)[2] for line in stats.splitlines()} == expected_paths
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          for path in files:
              path.unlink()
          pathlib.Path('.github/ui-review-final.yml').unlink()
          subprocess.run(['git', 'add', '--', *sorted(expected_paths), '.github'], check=True)
          # The job token is not allowed to modify workflows. The authorized
          # connector installs the read-only test workflow in the next commit.
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert not any(p.startswith('.github/workflows/') for p in changed)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
      - name: Publish source only to the requested branch
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/codex/ui-polish-20260923
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Polish welcome, local translation engines, mascot preview and OCR controls'
          git push origin HEAD:refs/heads/codex/ui-polish-20260923
          git log -1 --format='%H %s'
