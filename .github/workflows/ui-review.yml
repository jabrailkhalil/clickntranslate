name: UI branch review

on:
  push:
    branches: [codex/ui-polish-20260923]
  workflow_dispatch:
    inputs:
      native_desktop:
        description: Exercise the installed Qt platform plugin and keep rendered windows
        type: boolean
        default: false
      wayland:
        description: Verify screen capture and clipboard on two isolated Sway outputs
        type: boolean
        default: false
      session_stability:
        description: Repeat navigation on native desktops and measure idle resources
        type: boolean
        default: false
      arabic_ocr:
        description: Compare Arabic vowel marks on dark and light synthetic images
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  arabic:
    if: inputs.arabic_ocr
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, requirements: linux}
          - {runner: windows-2022, requirements: windows}
          - {runner: macos-15, requirements: macos}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements/${{ matrix.requirements }}.txt
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 tesseract-ocr-ara
      - name: Enable Windows Arabic OCR when the hosted image offers it
        if: runner.os == 'Windows'
        timeout-minutes: 3
        continue-on-error: true
        shell: pwsh
        run: |
          $capability = Get-WindowsCapability -Online -Name 'Language.OCR~~~ar-SA~*'
          if ($capability -and $capability.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $capability.Name -ErrorAction Stop
          }
      - run: python -m pip install -r tools/requirements/${{ matrix.requirements }}.txt
      - run: python tools/prepare_rapidocr_models.py
      - run: python tools/qa_arabic_recognition.py build/ocr-arabic/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-arabic-${{ matrix.requirements }}
          path: build/ocr-arabic/
          retention-days: 7

  native:
    if: inputs.native_desktop || inputs.session_stability
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, backend: windows, requirements: windows, label: windows-x64}
          - {runner: ubuntu-24.04, backend: xcb, requirements: linux, label: linux-x11}
          - {runner: macos-15, backend: cocoa, requirements: macos, label: macos-arm64}
          - {runner: macos-15-intel, backend: cocoa, requirements: macos, label: macos-intel}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: ${{ matrix.backend }}
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements/${{ matrix.requirements }}.txt
      - name: Install X11 and OCR fixtures
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth fonts-dejavu-core tesseract-ocr-eng tesseract-ocr \
            libegl1 libgl1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-util1 libxcb-cursor0 libxkbcommon-x11-0 \
            openbox trayer xdotool x11-utils libglib2.0-bin dbus-x11
      - id: deps
        name: Install platform dependencies
        run: |
          python -m pip install -r tools/requirements/${{ matrix.requirements }}.txt pytest
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            python -m pip install --no-deps 'argostranslate~=1.11.0'
          fi
      - name: Exercise and capture source application windows
        run: |
          prefix=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then prefix=(xvfb-run -a -s '-screen 0 1920x1200x24'); fi
          "${prefix[@]}" python src/main.py --candidate-smoke-test build/ui-native/widgets/report.json
      - name: Verify replacement targets in two native Cocoa fields when Accessibility is available
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.deps.outcome == 'success' }}
        run: python tools/qa_macos_selection_target.py --output build/ui-native/selection-target/report.json
      - name: Verify companion selection and replacement in native Windows fields
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.deps.outcome == 'success' }}
        shell: pwsh
        run: python -X faulthandler tools/qa_windows_selection_target.py --output build/ui-native/selection-target/report.json
      - name: Exercise language lists, package actions and fixed dialog layout
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          prefix=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then prefix=(xvfb-run -a -s '-screen 0 1920x1200x24'); fi
          "${prefix[@]}" python tools/run_regression_tests.py --qt-platform "$QT_QPA_PLATFORM" \
            --output build/ui-native/checks --basetemp build/ui-native/tmp \
            tests/test_popup_design.py tests/test_language_search.py tests/test_hotkey_language_picker.py \
            tests/test_package_presentation.py \
            tests/test_engine_center_actions.py tests/test_engine_center_stationary_layout.py \
            tests/test_guide_spotlight.py tests/test_companion_calm_menu.py tests/test_main_action_labels_i18n.py
      - name: Start in the tray and open the same process from the applications menu
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.deps.outcome == 'success' }}
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- \
            python tools/qa_linux_shadow_launch.py --output build/ui-native/shadow-login
      - name: Verify that selecting a changing X11 document submits the displayed pixels
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.deps.outcome == 'success' }}
        run: |
          CNT_QA_PRIVATE_X11=1 xvfb-run -a -s '-screen 0 1280x800x24' \
            python tools/run_regression_tests.py --qt-platform xcb --output build/ui-native/frozen-frame \
            --basetemp build/ui-native/frozen-frame/cases tests/test_native_x11_frozen_frame.py
      - name: Translate a generated X11 region and stop during compositor capture
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.deps.outcome == 'success' }}
        run: |
          CNT_QA_OUTPUT="$PWD/build/ui-native/dynamic-region" xvfb-run -a -s '-screen 0 1280x800x24' \
            python tools/qa_linux_dynamic_output.py
      - name: Repeat localized settings, language search and idle resource checks
        if: ${{ !cancelled() && inputs.session_stability && steps.deps.outcome == 'success' }}
        run: |
          prefix=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then prefix=(xvfb-run -a -s '-screen 0 1920x1200x24'); fi
          "${prefix[@]}" python tools/run_regression_tests.py --qt-platform "$QT_QPA_PLATFORM" \
            --output build/ui-native/soak --basetemp build/ui-native/soak/cases tests/acceptance_desktop_session.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-${{ matrix.label }}
          path: |
            build/ui-native/widgets/
            build/ui-native/checks/results.xml
            build/ui-native/checks/run.json
            build/ui-native/tmp/**/*.png
            build/ui-native/shadow-login/
            build/ui-native/frozen-frame/results.xml
            build/ui-native/frozen-frame/run.json
            build/ui-native/frozen-frame/cases/**/*.png
            build/ui-native/selection-target/
            build/ui-native/dynamic-region/
            build/ui-native/soak/results.xml
            build/ui-native/soak/cases/**/session.json
            build/ui-native/soak/cases/**/home-*.png
          if-no-files-found: warn
          retention-days: 7

  wayland:
    if: inputs.wayland
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the system Qt Wayland plugin and screenshot portal
        run: |
          sudo apt-get update
          sudo apt-get install -y sway swaybg grim wl-clipboard pipewire dbus-x11 xvfb xauth \
            xdg-desktop-portal xdg-desktop-portal-wlr xdg-desktop-portal-gtk \
            qtwayland5 python3-pyqt5 python3-venv python3-requests python3-pil
          sudo apt-get install -y --no-install-recommends xdg-desktop-portal-gnome
          /usr/bin/python3 -m venv --system-site-packages --without-pip "$RUNNER_TEMP/wayland-python"
      - name: Check equal and mixed monitor scales on fresh Wayland sessions
        run: |
          export PATH="$RUNNER_TEMP/wayland-python/bin:$PATH"
          result=0
          for scale in 1 1.5 2; do
            CNT_QA_WAYLAND_SCALE="$scale" dbus-run-session -- \
              bash tools/qa_linux_wayland.sh "build/ui-wayland/scale-$scale" || result=1
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-wayland
          path: build/ui-wayland/
          if-no-files-found: warn
          retention-days: 7

  source:
    if: '!inputs.native_desktop && !inputs.wayland && !inputs.session_stability && !inputs.arabic_ocr'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact reviewed source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ui-source"
          git archive --format=zip --output="$RUNNER_TEMP/ui-source/source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/ui-source/revision.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-source
          path: ${{ runner.temp }}/ui-source
          retention-days: 3
          if-no-files-found: error

  test:
    if: '!inputs.native_desktop && !inputs.wayland && !inputs.session_stability && !inputs.arabic_ocr'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            requirements: tools/requirements/windows.txt
          - os: ubuntu-latest
            requirements: tools/requirements/linux.txt
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install -r "${{ matrix.requirements }}" pytest pyinstaller
          if [ "${{ runner.os }}" = "Linux" ]; then
            python -m pip install --no-deps 'argostranslate~=1.11.0'
          fi
      - name: Focused UI follow-up tests
        run: python tools/run_regression_tests.py --output .tmp/ui-smoke tests/test_ui_polish.py tests/test_translation_result_ui.py tests/test_window_provider_dispatch.py tests/test_fixed_window_text_layout.py::FixedWindowTextLayoutTest::test_main_reference_text_fits_with_the_longest_provider_name
      - name: Render UI and sample animation in active and idle states
        run: python tools/qa_ui_polish.py --output .tmp/ui-renders --benchmark-seconds 5
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview-${{ runner.os }}
          path: .tmp/ui-renders
          include-hidden-files: true
          retention-days: 7
      - name: Run regression suite with isolated user data
        run: python tools/run_regression_tests.py --output .tmp/ui-ci --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review-${{ runner.os }}
          path: |
            test-results.xml
            .tmp/ui-ci/run.json
            .tmp/ui-smoke/run.json
            .tmp/ui-renders
          include-hidden-files: true
          retention-days: 7
