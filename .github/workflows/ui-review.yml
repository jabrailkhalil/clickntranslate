name: UI branch review

on:
  push:
    branches: [codex/ui-polish-20260923]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact reviewed source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ui-source"
          git archive --format=zip --output="$RUNNER_TEMP/ui-source/source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/ui-source/revision.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-source
          path: ${{ runner.temp }}/ui-source
          retention-days: 3
          if-no-files-found: error

  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            requirements: requirements.txt
          - os: ubuntu-latest
            requirements: requirements-linux.txt
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install -r "${{ matrix.requirements }}" pytest pyinstaller
          if [ "${{ runner.os }}" = "Linux" ]; then
            python -m pip install --no-deps 'argostranslate~=1.11.0'
          fi
      - name: Focused UI follow-up tests
        run: python tools/run_regression_tests.py --output .tmp/ui-smoke tests/test_ui_polish.py tests/test_translation_result_ui.py tests/test_window_provider_dispatch.py
      - name: Render UI and sample animation in active and idle states
        run: python tools/qa_ui_polish.py --output .tmp/ui-renders --benchmark-seconds 5
      - uses: actions/upload-artifact@v4
        with:
          name: ui-preview-${{ runner.os }}
          path: .tmp/ui-renders
          include-hidden-files: true
          retention-days: 7
      - name: Run regression suite with isolated user data
        run: python tools/run_regression_tests.py --output .tmp/ui-ci --junitxml=test-results.xml -x -vv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review-${{ runner.os }}
          path: |
            test-results.xml
            .tmp/ui-ci/run.json
            .tmp/ui-smoke/run.json
            .tmp/ui-renders
          include-hidden-files: true
          retention-days: 7
