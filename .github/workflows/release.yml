name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.release.outputs.build_required }}
    steps:
      - name: Keep an existing prepared release unchanged
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const tag = context.ref.replace('refs/tags/', '');
            const exists = releases.some(release => release.tag_name === tag);
            core.setOutput('build_required', String(!exists));
            if (exists) {
              core.info('A release already exists for this tag; keeping its prepared assets and description.');
            }

  macos:
    needs: plan
    if: needs.plan.outputs.build_required == 'true'
    uses: ./.github/workflows/macos.yml
    secrets:
      MACOS_SIGNING_KEYCHAIN_BASE64: ${{ secrets.MACOS_SIGNING_KEYCHAIN_BASE64 }}
      MACOS_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGNING_KEYCHAIN_PASSWORD }}

  linux:
    needs: plan
    if: needs.plan.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-linux.txt
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream libegl1 libgl1 python3-gi \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-util1 libxkbcommon-x11-0
          python -m venv "$RUNNER_TEMP/clickntranslate-venv"
          "$RUNNER_TEMP/clickntranslate-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/clickntranslate-venv/bin/python" -m pip install -r requirements-linux.txt pytest pyinstaller
          "$RUNNER_TEMP/clickntranslate-venv/bin/python" -m pip install --no-deps "argostranslate~=1.11.0"
      - name: Test Linux source
        run: |
          "$RUNNER_TEMP/clickntranslate-venv/bin/python" -m pytest -q
      - name: Build Linux release
        env:
          VENV: ${{ runner.temp }}/clickntranslate-venv
        run: bash tools/build_linux_release.sh
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            releases/Click-n-Translate-*-linux-x86_64.AppImage
            releases/Click-n-Translate-*-linux-x86_64.tar.gz
            releases/Click-n-Translate-*-linux-x86_64.sha256
          if-no-files-found: error

  draft:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select the version's download table
        shell: bash
        run: |
          release_body="docs/RELEASE_${GITHUB_REF_NAME#v}.md"
          test -s "$release_body"
          echo "RELEASE_BODY=$release_body" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: '*release'
          merge-multiple: true
          path: release-assets
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Click'n'Translate ${{ github.ref_name }}
          body_path: ${{ env.RELEASE_BODY }}
          files: |
            release-assets/*.AppImage
            release-assets/*.tar.gz
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.sha256
