name: Android device acceptance
on:
  push:
    branches: [android-release-updater]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      check_16k:
        type: boolean
        default: false
        description: Run native OCR on Android 16 with 16 KiB memory pages

permissions:
  contents: read

jobs:
  runtime-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref_name != 'android-release-updater' }}
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Reuse the Android frameworks verified by Robolectric
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-frameworks-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: Run unit tests including opt-in Compose runtime scenarios
        env:
          JAVA_TOOL_OPTIONS: -Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2
        run: >-
          bash gradlew :app:testDebugUnitTest --console=plain --no-parallel --max-workers=2
          -ParchiveCpuDebug=true -PruntimeUiTests
          '-Dorg.gradle.jvmargs=-Xmx3072m -XX:ActiveProcessorCount=3 -Dfile.encoding=UTF-8'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-test-results
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/ui-audit/*.png
          if-no-files-found: warn
          retention-days: 7

  android-15:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2
      - name: Select the native page-size check
        id: native_pages
        env:
          REQUESTED: ${{ inputs.check_16k }}
          BEFORE: ${{ github.event.before }}
        run: |
          check=false
          if [[ "$REQUESTED" == "true" ]]; then
            check=true
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null || ! git diff --quiet "$BEFORE" HEAD -- \
              app/build.gradle.kts app/src/main/cpp app/src/main/jniLibs gradle/libs.versions.toml \
              third_party tools/audit_apk.py tools/device_acceptance.sh .github/workflows/android-acceptance.yml; then
              check=true
            fi
          fi
          echo "check=$check" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/android-release-updater' }}
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Create the disposable debug certificate used by the installer test
        shell: bash
        run: |
          directory="$(mktemp -d "$RUNNER_TEMP/clickn-debug.XXXXXX")"
          store="$directory/debug.keystore"
          keytool -genkeypair -storetype JKS -keystore "$store" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -dname "CN=ClicknTranslate emulator acceptance" -validity 7
          echo "CLICKN_ACCEPTANCE_DEBUG_KEYSTORE=$store" >> "$GITHUB_ENV"
      - name: Build the debug app and test package
        id: build
        run: >-
          bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          --console=plain --no-parallel --max-workers=2 -ParchiveCpuDebug=true
          '-Dorg.gradle.jvmargs=-Xmx4096m -XX:ActiveProcessorCount=3 -Dfile.encoding=UTF-8'
      - name: Verify native libraries in the APK support 16 KiB pages
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/audit_apk.py --check-native-pages "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
      - name: Verify that the application and instrumentation use this runner's certificate
        shell: bash
        run: |
          fingerprint="$(keytool -exportcert -keystore "$CLICKN_ACCEPTANCE_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)"
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; do
            actual="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            test "$actual" = "$fingerprint"
          done
      - name: Enable hardware acceleration on the disposable runner
        id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-port: 5554
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bash tools/device_acceptance.sh emulator-5554
      - name: Exercise the same APK and its native OCR on Android 16 with 16 KiB pages
        if: ${{ !cancelled() && steps.native_pages.outputs.check == 'true' && steps.build.outcome == 'success' && steps.kvm.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          avd-name: clickn-16k
          emulator-port: 5556
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bash tools/device_acceptance.sh emulator-5556 native-16k
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-15-acceptance
          path: build/device-acceptance
          if-no-files-found: ignore
          retention-days: 7
