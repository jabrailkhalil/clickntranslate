name: External Mac desktop fixture
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements/macos.txt
      - name: Install project dependencies
        run: bash tools/setup_macos_env.sh
      - name: Recognize and replace text in an isolated TextEdit document
        run: .venv-macos/bin/python tools/qa_macos_external_text.py
      - name: Wait for the signed Apple Silicon test package
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 72); do
            if [ "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45968074075/artifacts --jq '[.artifacts[] | select(.name == "macos-arm64-prepared")] | length')" -gt 0 ]; then exit 0; fi
            if [ "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45968074075 --jq '.status')" = completed ]; then exit 1; fi
            sleep 5
          done
          exit 1
      - uses: actions/download-artifact@v4
        if: always()
        with:
          run-id: 45968074075
          github-token: ${{ github.token }}
          name: macos-arm64-prepared
          path: ${{ runner.temp }}/candidate
      - name: Install the unmodified signed DMG and ask the installed app for its own permissions
        if: always()
        run: |
          set -eu
          export CANDIDATE="$RUNNER_TEMP/candidate" QA="$RUNNER_TEMP/cnt-external"
          mkdir -p "$QA" build/macos/trace "$RUNNER_TEMP/cnt-dmg"
          (cd "$CANDIDATE" && shasum -a 256 -c *arm64.sha256)
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/cnt-dmg" "$CANDIDATE/Click-n-Translate-1.8.3-macos-arm64.dmg"
          ditto "$RUNNER_TEMP/cnt-dmg/ClicknTranslate.app" /Applications/ClicknTranslate.app
          hdiutil detach "$RUNNER_TEMP/cnt-dmg"
          codesign --verify --deep --strict -R '=identifier "io.github.jabrailkhalil.clickntranslate" and certificate root = H"fc6752f0026d34e5b63433544af788b8fc1899ef"' /Applications/ClicknTranslate.app
          /usr/bin/open -n -W -a /Applications/ClicknTranslate.app --args --macos-permission-report "$QA/frozen-permissions.json" --macos-capture-check
          cp "$QA/frozen-permissions.json" build/macos/trace/
          cp "$CANDIDATE/BUILD.json" build/macos/trace/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-external-textedit
          path: build/macos/trace/
