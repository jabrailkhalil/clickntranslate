name: Public translation providers on the GitHub network
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: eec0ed7951b1dafbe6479701162b6ca0d57ee324
          path: release-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Translate the single QA phrase with the four default public engines
        working-directory: release-candidate
        run: python ../tools/qa_public_translation.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos-public-translations
          path: release-candidate/online-providers.json
