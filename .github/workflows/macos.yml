name: macOS popup measurements
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements/macos.txt
      - name: Install native dependencies
        run: bash tools/setup_macos_env.sh
      - name: Compare actual Cocoa layout on fresh launches
        run: |
          for mode in baseline unfiltered proxy both; do
            .venv-macos/bin/python tools/trace_macos_popup.py "$mode"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-popup-native-trace
          path: build/macos/trace/
