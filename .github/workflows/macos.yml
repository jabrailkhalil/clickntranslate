name: Upgrade an old Mac install with the signed test ZIP
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: macos-15
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eec0ed7951b1dafbe6479701162b6ca0d57ee324
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements/macos.txt
      - run: bash tools/setup_macos_env.sh
      - uses: actions/download-artifact@v4
        with:
          run-id: 45970538250
          github-token: ${{ github.token }}
          name: macos-arm64-prepared
          path: ${{ runner.temp }}/new
      - name: Verify the public 1.8.2 ZIP and signed 1.8.3 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/old"
          gh release download v1.8.2 -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/old" -p 'Click-n-Translate-1.8.2-macos-arm64.zip' -p 'Click-n-Translate-1.8.2-macos-arm64.sha256'
          cd "$RUNNER_TEMP/old"
          grep '\.zip$' *arm64.sha256 | shasum -a 256 -c -
          ditto -x -k Click-n-Translate-1.8.2-macos-arm64.zip "$RUNNER_TEMP/old"
          test "$(defaults read "$RUNNER_TEMP/old/ClicknTranslate.app/Contents/Info" CFBundleShortVersionString)" = '1.8.2'
          codesign --verify --deep --strict -R '=identifier "io.github.jabrailkhalil.clickntranslate" and certificate root = H"fc6752f0026d34e5b63433544af788b8fc1899ef"' "$RUNNER_TEMP/old/ClicknTranslate.app"
          cd "$RUNNER_TEMP/new"
          shasum -a 256 -c *arm64.sha256
          test "$(jq -r .source_commit BUILD.json)" = 'eec0ed7951b1dafbe6479701162b6ca0d57ee324'
      - name: Update a release 1.8.2 bundle and verify GUI readiness and saved profile
        run: |
          .venv-macos/bin/python tools/qa_posix_update.py --kind macos --installed "$RUNNER_TEMP/old/ClicknTranslate.app" --package "$RUNNER_TEMP/new/Click-n-Translate-1.8.3-macos-arm64.zip" --version 1.8.3 --output "$RUNNER_TEMP/upgrade-success"
      - name: Verify that a killed replacement restores the actual 1.8.2 app
        run: |
          .venv-macos/bin/python tools/qa_posix_update.py --kind macos --installed "$RUNNER_TEMP/old/ClicknTranslate.app" --package "$RUNNER_TEMP/new/Click-n-Translate-1.8.3-macos-arm64.zip" --version 1.8.3 --output "$RUNNER_TEMP/upgrade-rollback" --scenario rollback
      - name: Collect only compact upgrade results
        if: always()
        run: |
          mkdir -p build/macos/trace
          for result in success rollback; do
            for file in report controller ui; do
              f="$RUNNER_TEMP/upgrade-$result/$file.json"
              if [ -f "$f" ]; then cp "$f" "build/macos/trace/$result-$file.json"; fi
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-native-upgrade
          path: build/macos/trace/
