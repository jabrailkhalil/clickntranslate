name: Measure Mac desktop scenarios
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements/macos.txt
      - name: Install native dependencies
        run: bash tools/setup_macos_env.sh
      - name: Run the native UI scenarios independently
        run: .venv-macos/bin/python tools/trace_macos_scenarios.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-popup-native-trace
          path: build/macos/trace/
