name: UI branch review

on:
  push:
    branches: [codex/ui-polish-20260923]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            requirements: requirements.txt
          - os: ubuntu-latest
            requirements: requirements-linux.txt
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install -r "${{ matrix.requirements }}" pytest pyinstaller
          if [ "${{ runner.os }}" = "Linux" ]; then
            python -m pip install --no-deps 'argostranslate~=1.11.0'
          fi
      - name: Run regression suite with isolated user data
        run: python tools/run_regression_tests.py --output .tmp/ui-ci --junitxml=test-results.xml
      - name: Render revised UI without network or desktop hooks
        run: python tools/qa_ui_polish.py --output .tmp/ui-renders
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review-${{ runner.os }}
          path: |
            test-results.xml
            .tmp/ui-ci/run.json
            .tmp/ui-renders
          include-hidden-files: true
          retention-days: 7
